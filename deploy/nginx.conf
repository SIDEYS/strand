# Load balancer for the local multi-instance setup (docker compose).
#
# The point of this project is that any instance can serve any client. This
# config therefore does NOTHING to keep a client on one instance.

worker_processes auto;

events {
    # One WebSocket is one connection to the client and one to an instance, so
    # this has to comfortably exceed twice the sockets you intend to hold.
    worker_connections 16384;
}

http {
    # Map the client's Upgrade header onto the Connection header the upstream
    # needs. Without this (and proxy_http_version 1.1 below) the WebSocket
    # handshake does not complete at all.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream strand {
        # ROUND-ROBIN IS DELIBERATE. Do not add ip_hash, hash, sticky, or any
        # other session affinity here. The claim being demonstrated is that
        # this system works without sticky sessions; a config that quietly
        # pinned clients to instances would make that demo pass for the wrong
        # reason, and would hide exactly the cross-instance paths (fan-out,
        # reconciliation, resume on a different instance) that need testing.
        server strand-1:8080;
        server strand-2:8080;
        server strand-3:8080;

        # A shared-memory zone makes the rotation global across nginx's worker
        # processes. Without it each worker keeps its own round-robin counter
        # starting at the first server, so light traffic clusters on strand-1
        # and an even spread only emerges under load. Still round-robin, and
        # still no affinity of any kind.
        zone strand 64k;
    }

    server {
        listen 80;

        # Operational endpoints are for Prometheus and operators, on the
        # internal network. They are not served to the public.
        location = /metrics {
            return 404;
        }

        location /ws {
            proxy_pass http://strand;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # nginx closes a proxied connection after proxy_read_timeout of
            # silence, 60s by default. For a WebSocket that would cut every
            # socket about once a minute regardless of the heartbeat, which
            # looks exactly like a bug in the reconnect logic. The heartbeat
            # interval is 15s, so these are set orders of magnitude above it:
            # a dead peer is detected by the application heartbeat, never by
            # the proxy.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Fail over quickly when an instance is down. The next connection
            # attempt goes to a live instance.
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout;
        }

        location / {
            proxy_pass http://strand;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout;
        }
    }
}
